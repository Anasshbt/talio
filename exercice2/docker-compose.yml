services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # Exposed for local dev/inspection only — remove in production
    ports:
      - "5433:5432"
    networks:
      - internal

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ..                            # build context = repo root (talio/)
      dockerfile: exercice2/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy           # wait for postgres to accept connections
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Exposed for local dev/API testing only — in prod, only nginx talks to backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - internal

  # ── React frontend (nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: exercice2/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - internal

# ── Persistent volumes ────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: talio_postgres_data

# ── Private bridge network (db & backend not reachable from outside) ──────────
networks:
  internal:
    driver: bridge
