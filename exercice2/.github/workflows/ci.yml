# ──────────────────────────────────────────────────────────────────────────────
# CI/CD — Talio Matching
# Place this file at .github/workflows/ci.yml from the repo root to activate.
#
# Pipeline:
#   1. test      : run pytest (backend)
#   2. build-fe  : npm build (frontend)
#   3. docker    : build both Docker images (runs only on main / tags)
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend tests ────────────────────────────────────────────────────────────
  test-backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4"

      - name: Install dependencies
        working-directory: exercice1/backend
        run: uv sync --group dev

      - name: Run tests
        working-directory: exercice1/backend
        run: uv run pytest tests/ -v --tb=short

  # ── Frontend build check ─────────────────────────────────────────────────────
  build-frontend:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: exercice1/frontend/package-lock.json

      - name: Install dependencies
        working-directory: exercice1/frontend
        run: npm install

      - name: Build
        working-directory: exercice1/frontend
        run: npm run build

  # ── Docker images ─────────────────────────────────────────────────────────────
  docker:
    name: Docker build & tag
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    # Only run on pushes to main or version tags (not PRs)
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Image versioning strategy:
      #   sha-<short_sha>  → every commit (enables precise rollback)
      #   latest           → tip of main branch
      #   v1.2.3           → semantic version tags
      - name: Compute image tags
        id: tags
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: exercice2/backend/Dockerfile
          push: false   # set to true + add registry login to push
          tags: |
            talio/backend:sha-${{ steps.tags.outputs.sha }}
            talio/backend:latest
            ${{ steps.tags.outputs.version && format('talio/backend:{0}', steps.tags.outputs.version) || '' }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: exercice2/frontend/Dockerfile
          push: false
          tags: |
            talio/frontend:sha-${{ steps.tags.outputs.sha }}
            talio/frontend:latest
            ${{ steps.tags.outputs.version && format('talio/frontend:{0}', steps.tags.outputs.version) || '' }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
