[alembic]
# Chemin vers le dossier des migrations
script_location = alembic

# L'URL est lue depuis la variable d'environnement DATABASE_URL dans alembic/env.py
# Ne pas renseigner ici pour éviter les credentials en dur
sqlalchemy.url =

# Formatage des noms de fichiers de migration : YYYY-MM-DD_HH-MM-SS_{rev}_{slug}
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
